[package]
name = "hyalite"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Exact, SIMD-accelerated sequence alignment (Smith-Waterman, Needleman-Wunsch, semi-global, overlap) with runtime CPU dispatch"
license = "MIT"
repository = "https://github.com/Psy-Fer/hyalite"
homepage = "https://github.com/Psy-Fer/hyalite"
documentation = "https://docs.rs/hyalite"
readme = "README.md"
authors = ["James Ferguson <j.ferguson@garvan.org.au>"]
keywords = ["bioinformatics", "alignment", "genomics", "simd", "smith-waterman"]
categories = ["science", "algorithms"]
# The `fuzz/` crate is a separate (nightly, cargo-fuzz) workspace kept in-repo but never published.
exclude = ["fuzz"]

[dependencies]

[dev-dependencies]
# Property-based / differential testing. Dev-only — the core stays dependency-free.
proptest = "1"
# Benchmark harness (dev-only).
criterion = "0.5"

[[bench]]
name = "cr4_scan"
harness = false

[[bench]]
name = "pairwise"
harness = false

[[bench]]
name = "traceback"
harness = false
